framework: owasp-aisvs-1-0
source_framework: pci-dss-v4

mappings:
  # ------------------------------------------------------------------
  # PCI-DSS 3.4: Render PAN unreadable anywhere it is stored
  #
  # AI context: Cardholder data must not appear in cleartext in model
  # context windows, training data labels, vector embeddings, or
  # agent memory. AISVS requirements for sensitive data masking
  # before embedding, label redaction, and preventing permanent
  # storage in models directly extend this PCI-DSS control to AI.
  # ------------------------------------------------------------------
  - requirement: "3.4"
    entries:
      - "1.2.3"    # Sensitive information in labels redacted/anonymized/encrypted
      - "5.2.3"    # Sensitive data retrieved via pipelines to prevent permanent storage in models
      - "5.2.4"    # Post-inference filtering prevents unauthorized data in responses
      - "8.2.1"    # Sensitive fields detected before embedding and masked/tokenized/dropped
    sufficiency: partial

  # ------------------------------------------------------------------
  # PCI-DSS 4.1: Use strong cryptography to safeguard cardholder data
  #              during transmission
  #
  # AI context: Data flows between AI components (model providers,
  # MCP servers, RAG pipelines, edge devices) must use encrypted
  # channels. AISVS extends transit security to AI-specific transports
  # including MCP streamable HTTP and edge device communication.
  # ------------------------------------------------------------------
  - requirement: "4.1"
    entries:
      - "1.1.3"    # Data integrity when training data is stored and transferred
      - "10.3.1"   # Authenticated encrypted streamable HTTP for MCP transport
      - "4.3.2"    # Models deployed to edge/mobile devices cryptographically signed
    sufficiency: partial

  # ------------------------------------------------------------------
  # PCI-DSS 6.5.1: Injection flaws, particularly SQL injection
  #
  # AI context: Prompt injection is the AI equivalent of SQL injection
  # -- untrusted input manipulates the execution context. AISVS C2.1
  # provides layered defenses: input normalization, encoding smuggling
  # detection, prompt injection classifiers, character allowlists,
  # and instruction hierarchy enforcement. MCP input screening and
  # output schema validation extend injection defense to tool calls.
  # ------------------------------------------------------------------
  - requirement: "6.5.1"
    entries:
      - "2.1.1"    # Input normalization before tokenization or embedding
      - "2.1.2"    # Encoding and representation smuggling detection
      - "2.1.3"    # Prompt injection detection ruleset/classifier
      - "2.1.5"    # Character set restriction (allowlist approach)
      - "2.1.6"    # Instruction hierarchy enforcement (system > user)
      - "7.1.1"    # Output schema validation (prevents injection via output)
      - "10.4.2"   # MCP tool responses screened for indirect prompt injection
      - "10.4.3"   # MCP servers reject unrecognized/oversized parameters
    sufficiency: partial

  # ------------------------------------------------------------------
  # PCI-DSS 7.1: Limit access to system components and cardholder data
  #              to only those whose job requires such access
  #
  # AI context: AI systems introduce new access surfaces -- model
  # weights, training data, vector stores, agent tool invocations.
  # AISVS requires default-deny policies on all AI resources, end-user
  # authorization enforcement in RAG pipelines (not just service
  # account permissions), and fine-grained agent action authorization.
  # ------------------------------------------------------------------
  - requirement: "7.1"
    entries:
      - "5.2.1"    # AI resources enforce access controls with default-deny
      - "5.2.2"    # RAG/embedding pipelines enforce end-user authorization at each stage
      - "5.2.6"    # JIT privileged access to model weights/pipelines with auto-expiry
      - "9.5.1"    # Agent actions authorized against fine-grained runtime policies
    sufficiency: partial

  # ------------------------------------------------------------------
  # PCI-DSS 7.2: Establish access control system based on user's
  #              need to know
  #
  # AI context: In AI systems, "need to know" extends to what data
  # the model can surface in responses, what tools an agent can
  # invoke, and where access control decisions are enforced. AISVS
  # requires post-inference output filtering, policy decision point
  # isolation from agent execution, and critically -- that access
  # control is enforced by application logic, never by the AI model.
  # ------------------------------------------------------------------
  - requirement: "7.2"
    entries:
      - "5.2.1"    # AI resources enforce access controls with default-deny
      - "5.2.4"    # Post-inference filtering prevents unauthorized data in responses
      - "5.2.5"    # Policy decision point isolated from agent execution environment
      - "9.5.3"    # Access control enforced by application logic, never by AI model
    sufficiency: partial

  # ------------------------------------------------------------------
  # PCI-DSS 8.3: Secure all individual non-console administrative
  #              access using multi-factor authentication
  #
  # AI context: AI operations (model deployment, weight export,
  # training data access) are high-risk administrative actions.
  # AISVS requires step-up authentication for these operations,
  # short-lived cryptographic tokens for AI agents, and per-request
  # token validation on MCP servers.
  # ------------------------------------------------------------------
  - requirement: "8.3"
    entries:
      - "5.1.1"    # Step-up authentication for high-risk AI operations
      - "5.1.2"    # AI agents authenticate with short-lived, minimal-scoped tokens
      - "10.2.1"   # MCP servers validate access tokens per request
      - "10.2.2"   # MCP servers validate token issuer, audience, expiry, scope (OAuth 2.1)
    sufficiency: partial

  # ------------------------------------------------------------------
  # PCI-DSS 10.2: Implement automated audit trails for all system
  #               components
  #
  # AI context: AI systems require AI-specific audit telemetry beyond
  # traditional logging -- model identifiers, token usage, provider
  # names, RAG retrieval events, safety filter decisions, and
  # security-critical agent actions. AISVS extends audit trails to
  # cover the full AI lifecycle including training data lineage and
  # model change records.
  # ------------------------------------------------------------------
  - requirement: "10.2"
    entries:
      - "12.1.1"   # AI interactions logged with session context and telemetry
      - "12.1.2"   # Safety filtering and policy decisions logged for audit/forensics
      - "12.1.3"   # Structured schema: model ID, token usage, provider, operation type
      - "12.1.4"   # RAG pipeline retrieval events logged (query, documents, source)
      - "12.4.2"   # Security-critical proactive actions logged with approver/timestamp
      - "12.5.3"   # All model changes generate immutable audit records
    sufficiency: partial
