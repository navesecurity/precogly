pack:
  schema_version: 1
  slug: iec-62443
  name: IEC 62443
  version: 1.0.0
  pack_type: compliance
  author: Precogly
  description: IEC 62443 Industrial Automation and Control Systems Security standard, split by Security Level. SL-1 contains
    base requirements; SL-2 adds requirements for protection against intentional violation using simple means.
  tags:
  - compliance
  - ics-security
  - industrial
  - ot-security
  - scada
  - energy
  - manufacturing
  - utilities
  - oil-gas
  - chemicals
frameworks:
- slug: iec-62443-sl1
  name: IEC 62443 SL-1
  version: 3-3:2013
  issuer: IEC
  description: Base security requirements (Security Level 1). Protection against casual or coincidental violation. Core SRs
    from all seven Foundational Requirements.
  requirements:
  - section_code: SR 1.1
    description: 'Human user identification and authentication: the control system shall identify and authenticate all human
      users'
  - section_code: SR 1.2
    description: 'Software process and device identification and authentication: the control system shall identify and authenticate
      all software processes and devices'
  - section_code: SR 1.3
    description: 'Account management: the control system shall provide the capability to manage all accounts, including adding,
      activating, modifying, disabling, and removing accounts'
  - section_code: SR 2.1
    description: 'Authorization enforcement: the control system shall enforce assigned privileges for all access to the system
      on all interfaces'
  - section_code: SR 2.5
    description: 'Session lock: the control system shall provide the capability to prevent further access by initiating a
      session lock after a configurable time period of inactivity'
  - section_code: SR 2.8
    description: 'Auditable events: the control system shall generate audit records for all auditable events including access
      control, system events, and security-relevant operations'
  - section_code: SR 2.9
    description: 'Audit storage capacity: the control system shall provide audit storage capacity sufficient to store the
      required records and protect against loss'
  - section_code: SR 3.1
    description: 'Communication integrity: the control system shall protect the integrity of transmitted information across
      all communication channels'
  - section_code: SR 3.2
    description: 'Malicious code protection: the control system shall provide protection against malicious code including
      viruses, worms, and trojan horses'
  - section_code: SR 3.4
    description: 'Software and information integrity: the control system shall provide the capability to detect and report
      unauthorized changes to software and information'
  - section_code: SR 3.5
    description: 'Input validation: the control system shall validate the syntax and content of any input used as an industrial
      process control input'
  - section_code: SR 4.1
    description: 'Information confidentiality: the control system shall protect the confidentiality of information at rest
      and in transit for which explicit read authorization is supported'
  - section_code: SR 5.1
    description: 'Network segmentation: the control system shall reside on a network that is logically and physically segmented
      from non-control system networks'
  - section_code: SR 5.2
    description: 'Zone boundary protection: the control system shall monitor and control communications at zone boundaries
      using boundary protection mechanisms'
  - section_code: SR 6.1
    description: 'Audit log accessibility: the control system shall provide the capability for authorized personnel to read
      all audit records'
  - section_code: SR 7.1
    description: 'Denial of service protection: the control system shall protect against denial of service attacks and maintain
      essential functions during adverse conditions'
  - section_code: SR 7.2
    description: 'Resource management: the control system shall manage resources to support essential functions under all
      operating conditions'
  - section_code: SR 7.3
    description: 'Control system backup: the control system shall provide the capability to perform and verify backups of
      user-level and system-level information'
  - section_code: SR 7.4
    description: 'Control system recovery and reconstitution: the control system shall provide the capability to recover and
      reconstitute to a known secure state after a disruption'
  - section_code: SR 7.6
    description: 'Network and security configuration settings: the control system shall provide the capability to configure
      network and security settings according to recommended guidance'
  - section_code: SR 7.7
    description: 'Least functionality: the control system shall restrict the use of unnecessary functions, ports, protocols,
      and services'
- slug: iec-62443-sl2
  name: IEC 62443 SL-2
  version: 3-3:2013
  issuer: IEC
  description: Additional requirements for Security Level 2. Protection against intentional violation using simple means.
    Includes requirement enhancements (REs) and additional SRs beyond the SL-1 base.
  requirements:
  - section_code: SR 1.1 RE 1
    description: 'Unique identification and authentication: all human users shall be uniquely identified and authenticated,
      not using shared or group accounts'
  - section_code: SR 1.5
    description: 'Authenticator management: the control system shall manage authenticators including initial distribution,
      lost/compromised replacement, and revocation'
  - section_code: SR 1.7
    description: 'Strength of password-based authentication: the control system shall enforce minimum password strength requirements
      including length, complexity, and expiration'
  - section_code: SR 1.9
    description: 'Strength of public key authentication: the control system shall enforce public key authentication with minimum
      key lengths and approved algorithms'
  - section_code: SR 1.13
    description: 'Access via untrusted networks: the control system shall monitor and control all access via untrusted networks'
  - section_code: SR 2.1 RE 1
    description: 'Authorization enforcement for all users: enforce assigned privileges for all users including automated processes
      and software agents, not only human operators'
  - section_code: SR 2.2
    description: 'Wireless use control: the control system shall provide the capability to authorize, monitor, and enforce
      usage restrictions for wireless connectivity'
  - section_code: SR 2.4
    description: 'Mobile code: the control system shall provide the capability to enforce usage restrictions for mobile code
      technologies'
  - section_code: SR 2.6
    description: 'Remote session termination: the control system shall provide the capability to terminate a remote session
      after a configurable time period of inactivity'
  - section_code: SR 3.1 RE 1
    description: 'Cryptographic integrity protection: employ cryptographic mechanisms to recognize changes to information
      during communication, including unauthorized modification'
  - section_code: SR 3.3
    description: 'Security functionality verification: the control system shall provide the capability to verify the intended
      operation of security functions and report anomalies'
  - section_code: SR 4.2
    description: 'Information persistence: the control system shall protect against unauthorized retrieval of confidential
      information from shared resources when released'
  - section_code: SR 4.3
    description: 'Use of cryptography: the control system shall employ cryptographic mechanisms to prevent unauthorized disclosure
      of information at rest and in transit'
  - section_code: SR 5.3
    description: 'General purpose person-to-person communication restrictions: the control system shall prevent general-purpose
      person-to-person messaging in the control system network'
  - section_code: SR 5.4
    description: 'Application partitioning: the control system shall support the partitioning of applications into separate
      execution environments'
  - section_code: SR 6.2
    description: 'Continuous monitoring: the control system shall provide the capability to continuously monitor all security
      mechanisms to detect, characterize, and report security-relevant events in a timely manner'
  - section_code: SR 7.8
    description: 'Control system component inventory: the control system shall provide the capability to report the current
      inventory of all control system components, identifying rogue or unauthorized devices on the network'
